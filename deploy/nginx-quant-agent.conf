# quant-agent reverse proxy
# Replaced with the HTTPS version by certbot once the certificate is issued.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name 140.83.85.141.nip.io;

    client_max_body_size 10m;

    access_log /var/log/nginx/quant-agent.access.log;
    error_log  /var/log/nginx/quant-agent.error.log;

    location / {
        proxy_pass http://127.0.0.1:8643;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # Multi-model AI runs are synchronous and may take 60s+.
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering       off;
    }
}
